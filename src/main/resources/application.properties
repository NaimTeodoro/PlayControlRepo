spring.application.name=PlayControl

# --- Base de datos ---
# Por defecto usa el PostgreSQL local. Para el despliegue definir DB_URL, DB_USER y DB_PASSWORD
# como variables de entorno (no guardar claves reales en este archivo).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/PlayControlDB}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (en producción definir JWT_SECRET con mínimo 32 caracteres) ---
jwt.secret=${JWT_SECRET:solo-para-desarrollo-cambiar-en-produccion-0123456789}

# --- CORS: origen(es) del front Angular, separados por coma ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# --- Datos de prueba (config/DataLoader) ---
# auto  = cargar solo si la BD es local (localhost / 127.0.0.1)
# true  = cargar en cualquier BD (despliegue de demostracion)
# false = nunca
# En todos los casos solo carga si la tabla usuario esta vacia.
app.seed=${APP_SEED:auto}

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
